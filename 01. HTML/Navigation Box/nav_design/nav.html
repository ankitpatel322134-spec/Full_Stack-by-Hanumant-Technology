<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Design</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            border-radius: border-box ;
        }
        body{
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
        }

        header{
            padding: 20px 150px;
            img{
                height: 20px;
            }
            .nav_box{
                float:right;

                a{
                    text-decoration: none;
                    color: rgba(0, 0, 0, 0.499);
                    margin: 0px 10px;
                }

                a:hover{
                    color: #0000ff81;
                }

                .button{
                    margin-left: 150px;
                    background-color: #0000FFaa;
                    padding: 5px 20px ;
                    border-radius: 5px;
                    color: rgba(255, 255, 255, 0.893);
                }

                .button:hover{
                    background-color: #0000FF;
                    color: white;
                    transition-duration: 0.2s;
                    transition-timing-function: ease-in-out;
                }
            }
        }

    </style>
</head>
<body >
    <header>

        <img src="./nav.svg" alt="Logo">

        <div class="nav_box">
            <a href="#home">Home</a>
            <a href="#frature">Feature</a>
            <a href="#pricing">Pricing</a>
            <a href="#blog">Blog</a>
            <a href="#about">About</a>
            <a href="#button" class="button">Button</a>
        </div>

    </header>
    
</body>
</html>
