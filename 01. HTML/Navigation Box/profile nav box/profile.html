<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile-Nav-Box</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            border-radius:border-box;
        }
        body{
            background-color: #1E1E1E;
        }
        header{
            margin-top: 2px;
            padding: 15px 30px ;
            background-color: #2A2A2A;
            border: 1px solid rgba(255, 255, 255, 0.107);
            border-radius: 10px;
            img{
                height: 35px;
                border-radius: 50%;
                margin: 5px 10px;
            }

            .nav_box{
                float: right;
                margin: 10px 25px;
                a{
                    padding:0px 20px;
                    text-decoration: none;
                    color: rgba(255, 255, 255, 0.627);
                    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                }
                a:hover{
                    color: #FFBF00;
                }

                .button{
                    background-color: #28a745;
                    margin-left: 150px;
                    padding: 5px 20px;
                    border-radius: 5px;
                    color: rgba(255, 255, 255, 0.847)


                }

            }






        }
    </style>
</head>
<body>
    <header>
        <img src="./IMG_20250128_004605_538.webp" alt="Photo">
        <div class="nav_box">
            <a style="color: #FFBF00" href="#about">About</a>
            <a href="#education">Education</a>
            <a href="#skil">Skills</a>
            <a href="#contact">Profile</a>
            <a href="#login" class="button">Login</a>
        </div>
    </header>
</body>
</html>
