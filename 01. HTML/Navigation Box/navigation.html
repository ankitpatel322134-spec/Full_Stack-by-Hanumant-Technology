<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation_box</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            border-radius: border-box;
        }

        header{
            padding: 10px 30px;
            h1{
                display: inline-block;
                
            }
        }
        .navigation_box{
            float: right;
            margin-top: 10px;
            
            a{
                margin: 0px 10px ;
                text-decoration: none;
                color: black;
            }
        }



    </style>
</head>
<body>

    <header>
        <h1>Logo</h1>
        <div class="navigation_box">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </header>
    
</body>
</html>
