<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic project</title>
    <style>

        *{
            padding: 0px;
            margin: 0px;
            border-radius:border-box;
        }

        .header{
            background-image: url(./GKV26CJ.jpeg);
            background-size: cover;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            color: white;
            text-align: center;
            padding-top: 50vh;
        }
        .pairagraph{
            text-align: center;
            font-size: 1.3rem;
            padding:20px;    
        }

         .immersive{
            background-image: url(./Iqn4FBq.jpeg);
            background-size: cover;
            background-attachment: fixed;
            color: white;
            text-align: center;
            padding: 50vh;
            height: 100vh;
        }

        .footer{
            text-align: center;
            padding:20px;
            font-size: 1.4rem;;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="header">Welcome to Our Parallax Site</h1>
    </header>


    <article class="pairagraph">
        <p>This is a regular content section. Scroll down to see the parallax effect.</p>
    </article>

    <section >
        <h1 class="immersive">Immersive Experience</h1>
    </section>


    <footer>
        <p class="footer">More content can go here. The next background will start with another scroll.</p>
    </footer>




    
</body>
</html>
