<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Conveter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="currency.css">
</head>
<body>
    <div class="contaner">
        <h2>Currency Conveter</h2>
        <form >
            <div class="amount">
                <p>Enter Amount</p>
                <input type="text" value="100">
            </div>
            <div class="deopdown">
            
                <div class="from">
                    <p>Form</p>
                    <div class="select-contanner">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="flage is load">
                        <select name="from" >
                            <option value="IND">INR</option>
                            <option value="USA" selected>USA</option>
                            <option value="EUR">EUR</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="from">
                    <p>To</p>
                    <div class="select-contanner">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="Flagsapi load">
                        <select name="to" >
                            <option value="IND">INR</option>
                            <option value="USA">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>
                </div>
            </div>         
            <div class="random">1 USD = 80INR</div>
            <button>Exchanfe Rate</button>            
        </form>
    </div>
    <script src="currency.js"></script>
    <script src="currency1.js"></script>
</body>
</html>
